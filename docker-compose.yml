version: "3.8"

services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  migrate:
    build: .
    container_name: migrate
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - app-network
    command: alembic upgrade head
    restart: "no"

  web:
    build: .
    container_name: web
    ports:
      - "8000:8000"
    depends_on:
      - db
      - migrate
    env_file:
      - .env
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
